<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5EEFF" />

    <title>BIRD | Shop Something Awesome</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      /* Bird loader: hidden by default */
      #bird-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        background: linear-gradient(
          135deg,
          #e9d5ff 0%,
          #f5eeff 45%,
          #ede9fe 100%
        );
        font-family: Arial, Helvetica, sans-serif;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      #bird-loader.bird-loader-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      #bird-loader.bird-loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Lavender loader card */
      .bird-loader-content {
        width: 100%;
        max-width: 850px;
        margin: auto;
        padding: 32px 40px;
        text-align: center;
        background: linear-gradient(
          145deg,
          #f5eeff 0%,
          #ede2ff 50%,
          #f3e8ff 100%
        );
        border: 1px solid #d8b4fe;
        border-radius: 32px;
        box-shadow: 0 24px 70px rgba(91, 33, 182, 0.16);
        animation: bird-appear 0.6s ease both;
        max-height: calc(100dvh - 48px);
        overflow-y: auto;
      }

      /* BIRD mascot */
      .bird-loader-image {
        display: block;
        width: 90%;
        max-width: 680px;
        height: auto;
        max-height: 38vh;
        object-fit: contain;
        margin: 0 auto 12px;
        border-radius: 20px;
        animation: bird-float 2.4s ease-in-out infinite;
      }

      /* Heading */
      .bird-loader-title {
        margin: 12px 0;
        color: #4c1d95;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -1px;
      }

      /* Message */
      .bird-loader-message {
        margin: 0 auto 26px;
        max-width: 520px;
        color: #6b5b7b;
        font-size: clamp(15px, 2.5vw, 18px);
        line-height: 1.7;
      }

      /* Progress bar */
      .bird-progress-track {
        width: 100%;
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #ddd0f8;
      }

      .bird-progress-bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6d28d9, #a78bfa, #5b21b6);
        box-shadow: 0 0 12px rgba(109, 40, 217, 0.25);
        animation: bird-progress 1.8s ease-in-out infinite alternate;
      }

      /* Footer */
      .bird-loader-footer {
        margin-top: 20px;
        color: #7c3aed;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 3px;
      }

      @keyframes bird-float {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }

        50% {
          transform: translateY(-10px) rotate(1deg);
        }
      }

      @keyframes bird-progress {
        from {
          width: 20%;
        }

        to {
          width: 85%;
        }
      }

      @keyframes bird-appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Tablet */
      @media (max-width: 768px) {
        #bird-loader {
          padding: 20px;
        }

        .bird-loader-content {
          max-width: 650px;
          padding: 28px 24px;
          border-radius: 26px;
        }

        .bird-loader-image {
          width: 100%;
          max-width: 560px;
          margin-bottom: 18px;
        }

        .bird-loader-title {
          font-size: clamp(27px, 5vw, 38px);
        }
      }

      /* Mobile */
      @media (max-width: 480px) {
        #bird-loader {
          padding: 14px;
        }

        .bird-loader-content {
          padding: 22px 16px;
          border-radius: 24px;
        }

        .bird-loader-image {
          width: 100%;
          max-width: 100%;
          margin-bottom: 16px;
          border-radius: 14px;
        }

        .bird-loader-title {
          font-size: clamp(25px, 7vw, 32px);
          letter-spacing: -0.5px;
        }

        .bird-loader-message {
          margin-bottom: 22px;
          font-size: 15px;
        }

        .bird-progress-track {
          height: 10px;
        }

        .bird-loader-footer {
          font-size: 9px;
          letter-spacing: 2px;
        }
      }

      /* Reduced motion accessibility */
      @media (prefers-reduced-motion: reduce) {
        .bird-loader-image,
        .bird-progress-bar,
        .bird-loader-content {
          animation: none;
        }

        #bird-loader {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="bird-loader" role="status" aria-live="polite">
      <div class="bird-loader-content">
        <img
          src="/bird-loader.png"
          alt="Funny BIRD shopping mascot waking up"
          class="bird-loader-image"
          onerror="this.style.display = 'none'"
        />

        <h1 class="bird-loader-title">Arre, ruk jao yaar! 😂</h1>

        <p class="bird-loader-message">
          Bas BIRD uth raha hai! Tumhare liye shopping experience ready kar rahe
          hain. 🛍️
        </p>

        <div
          class="bird-progress-track"
          role="progressbar"
          aria-label="Getting your shopping experience ready"
        >
          <div class="bird-progress-bar"></div>
        </div>

        <p class="bird-loader-footer">GOOD THINGS ARE WORTH THE WAIT!</p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (() => {
        const loader = document.getElementById("bird-loader");
        const loaderKey = "bird_initial_loader_seen";

        let alreadySeen = false;

        try {
          alreadySeen = sessionStorage.getItem(loaderKey) === "1";
        } catch (error) {
          // If storage is unavailable, skip the initial loader.
          alreadySeen = true;
        }

        let showTimer;
        let hideTimer;
        let finished = false;

        function hideBirdLoader() {
          if (finished) return;

          finished = true;

          clearTimeout(showTimer);
          clearTimeout(hideTimer);

          loader.classList.remove("bird-loader-visible");
          loader.classList.add("bird-loader-hidden");

          hideTimer = setTimeout(() => {
            loader.remove();
          }, 450);
        }

        window.hideBirdLoader = hideBirdLoader;

        window.addEventListener("bird-loader-hide", hideBirdLoader);

        // Do not show the full-screen loader again in this tab session.
        if (alreadySeen) {
          hideBirdLoader();
          return;
        }

        // Show only if the first eligible page load takes over 500 ms.
        showTimer = setTimeout(() => {
          if (finished) return;

          try {
            sessionStorage.setItem(loaderKey, "1");
          } catch (error) {
            // Continue without session tracking.
          }

          loader.classList.add("bird-loader-visible");
        }, 500);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
